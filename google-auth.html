<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #202124; color: #e8eaed; }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-6 select-none">

    <div>
        <!-- Google Header Logo -->
        <div class="flex items-center gap-2 mb-6">
            <svg class="w-6 h-6" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
                <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
                <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
            </svg>
            <span class="text-sm font-medium text-slate-300">Sign in with Google</span>
        </div>

        <h1 class="text-2xl font-normal text-white tracking-tight mb-1">Choose an account</h1>
        <p class="text-sm text-slate-400 mb-6">to continue to <strong class="text-emerald-400">KryptPay Executive Gateway</strong></p>

        <!-- Dynamic Custom Email Account Entry Form -->
        <form id="custom-account-form" onsubmit="submitCustomAccount(event)" class="space-y-4 bg-slate-900/90 p-4 rounded-2xl border border-slate-700/80 shadow-lg">
            <div>
                <label class="text-xs font-medium text-slate-300 block mb-1.5">Google / Gmail Address</label>
                <input type="email" id="custom-email" required placeholder="name@gmail.com"
                    class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3.5 py-3 text-sm text-white focus:outline-none focus:border-blue-500 font-sans">
            </div>

            <div>
                <label class="text-xs font-medium text-slate-300 block mb-1.5">Full Name (Optional)</label>
                <input type="text" id="custom-name" placeholder="Your Name"
                    class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 font-sans">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm py-3 rounded-xl transition-colors shadow-md flex items-center justify-center gap-2">
                <span>Continue & Sign In</span>
            </button>
        </form>
    </div>

    <!-- Google Footer Privacy Info -->
    <div class="mt-8 text-xs text-slate-400 space-y-2">
        <p>To continue, Google will share your name, email address, and profile picture with KryptPay. Before using this app, review KryptPay's privacy policy and terms of service.</p>
        <div class="flex justify-between items-center text-[11px] text-slate-500 pt-2 border-t border-slate-800">
            <span>English (United States)</span>
            <div class="flex gap-3">
                <a href="#" class="hover:underline">Help</a>
                <a href="#" class="hover:underline">Privacy</a>
                <a href="#" class="hover:underline">Terms</a>
            </div>
        </div>
    </div>

    <script>
        async function selectAccount(email, name) {
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        name: name,
                        picture: 'https://lh3.googleusercontent.com/a/default-user=s96-c'
                    })
                });
                const data = await res.json();
                if (data.status === 1) {
                    if (window.opener) {
                        window.opener.postMessage({ type: 'GOOGLE_AUTH_SUCCESS', user: data.user }, '*');
                    }
                    window.close();
                } else {
                    alert('Google Sign-In Error: ' + data.message);
                }
            } catch (err) {
                console.error('Google popup auth error:', err);
                alert('Connection error during Google auth.');
            }
        }

        function submitCustomAccount(e) {
            e.preventDefault();
            const email = document.getElementById('custom-email').value.trim();
            let name = document.getElementById('custom-name').value.trim();
            if (email) {
                if (!name) {
                    const prefix = email.split('@')[0];
                    name = prefix.charAt(0).toUpperCase() + prefix.slice(1);
                }
                selectAccount(email, name);
            }
        }
    </script>
</body>
</html>
